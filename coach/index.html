<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英作文コーチ</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="coach.css">
</head>
<body>
  <header class="top">
    <h1>英作文コーチ</h1>
    <nav class="tabs" aria-label="画面の切り替え">
      <button type="button" class="tab" data-tab="write" aria-current="page">書く</button>
      <button type="button" class="tab" data-tab="review">復習 <span id="review-badge" class="badge" hidden></span></button>
      <button type="button" class="tab" data-tab="history">履歴</button>
    </nav>
  </header>

  <main>
    <p id="env-warning" class="warn-box" hidden></p>

    <!-- 書く -->
    <section id="tab-write" class="screen">
      <div class="card" id="step1">
        <h2><span class="num">1</span>書きたい文章</h2>
        <textarea id="src" rows="4" placeholder="例：先日の打ち合わせの件ですが、社内で検討した結果、来月から試験的に導入することになりました。詳細は追ってご連絡します。"></textarea>
        <div class="selects">
          <label>場面
            <select id="scene">
              <option value="">指定なし</option>
              <option>社外メール</option>
              <option>社内メール・チャット</option>
              <option>会議での発言</option>
              <option>プレゼン</option>
              <option>商談・交渉</option>
              <option>電話</option>
              <option>雑談・あいさつ</option>
            </select>
          </label>
          <label>相手
            <select id="audience">
              <option value="">指定なし</option>
              <option>取引先・顧客</option>
              <option>上司・役員</option>
              <option>同僚</option>
              <option>部下・後輩</option>
              <option>初対面の相手</option>
            </select>
          </label>
        </div>
        <div class="row">
          <button type="button" id="btn-easy" class="primary">英語にしやすい日本語にする</button>
        </div>
        <div class="status" id="easy-status" hidden>
          <span class="spinner" aria-hidden="true"></span><span class="status-text"></span>
          <button type="button" class="link stop">止める</button>
        </div>
      </div>

      <div class="card" id="step2" hidden>
        <h2><span class="num">2</span>英語にしやすい日本語</h2>
        <textarea id="easy" rows="3"></textarea>
        <p class="muted small">この日本語を見て英文を考えます。必要なら直してもかまいません。</p>
        <h3>言い換えたところ</h3>
        <ul id="easy-points" class="points"></ul>
        <details id="phrases-box">
          <summary>ヒント：使えそうな表現を見る</summary>
          <ul id="phrases" class="phrases"></ul>
        </details>
      </div>

      <div class="card" id="step3" hidden>
        <h2><span class="num">3</span>あなたの英文</h2>
        <textarea id="mine" rows="4" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="上の日本語を英語にしてください"></textarea>
        <div class="row">
          <button type="button" id="btn-eval" class="primary">添削する</button>
        </div>
        <div class="status" id="eval-status" hidden>
          <span class="spinner" aria-hidden="true"></span><span class="status-text"></span>
          <button type="button" class="link stop">止める</button>
        </div>
      </div>

      <div class="card" id="step4" hidden>
        <h2><span class="num">4</span>添削結果</h2>
        <div id="eval-view"></div>
        <p id="saved-status" class="muted small"></p>
        <div class="row">
          <button type="button" id="btn-retry" class="secondary">書き直してもう一度添削</button>
          <button type="button" id="btn-new" class="primary">新しい文章を書く</button>
        </div>
      </div>
    </section>

    <!-- 復習 -->
    <section id="tab-review" class="screen" hidden>
      <div id="review-home">
        <h2>復習</h2>
        <p id="review-summary" class="muted"></p>
        <div class="row">
          <button type="button" id="btn-review-old" class="primary">まだ復習していない順に10問</button>
          <button type="button" id="btn-review-random" class="secondary">ランダムに10問</button>
        </div>
      </div>

      <div id="review-quiz" hidden>
        <div class="quiz-head">
          <span id="rv-progress" class="muted"></span>
          <button type="button" id="rv-quit" class="link">やめる</button>
        </div>
        <div class="bar"><div id="rv-bar"></div></div>
        <p id="rv-easy" class="ja"></p>
        <details class="src-box">
          <summary>元の文章を見る</summary>
          <p id="rv-src" class="muted"></p>
        </details>
        <form id="rv-form" autocomplete="off">
          <textarea id="rv-answer" rows="3" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="英語で入力して Ctrl+Enter（スマホは「判定」）"></textarea>
          <div class="row">
            <button type="submit" class="primary">判定</button>
            <button type="button" id="rv-giveup" class="secondary">わからない</button>
          </div>
        </form>
        <div id="rv-feedback" class="feedback" hidden>
          <p id="rv-verdict" class="verdict"></p>
          <div class="cmp"><span class="lbl">あなた</span><p id="rv-your" class="en"></p></div>
          <div class="cmp"><span class="lbl">お手本</span><p id="rv-correct" class="en"></p></div>
          <p id="rv-others" class="others" hidden></p>
          <div class="row">
            <button type="button" id="rv-speak" class="secondary">読み上げ</button>
            <button type="button" id="rv-ask" class="secondary">Claudeに添削してもらう</button>
            <button type="button" id="rv-next" class="primary">次へ</button>
          </div>
          <div class="status" id="rv-status" hidden>
            <span class="spinner" aria-hidden="true"></span><span class="status-text"></span>
            <button type="button" class="link stop">止める</button>
          </div>
          <div id="rv-eval"></div>
        </div>
      </div>

      <div id="review-result" hidden>
        <h2>結果</h2>
        <p id="rv-result-text" class="big"></p>
        <div class="row">
          <button type="button" id="rv-back" class="primary">復習のトップに戻る</button>
        </div>
      </div>
    </section>

    <!-- 履歴 -->
    <section id="tab-history" class="screen" hidden>
      <h2>履歴 <span id="history-count" class="muted small"></span></h2>
      <p id="history-empty" class="muted">まだ保存された文章はありません。「書く」で添削すると、ここに保存されます。</p>
      <ul id="history-list" class="history"></ul>
    </section>
  </main>

  <script src="../js/judge.js"></script>
  <script src="coach.js"></script>
</body>
</html>
